name: Refresh BigQuery HDB resale prices

# scripts/load_hdb_resale_to_bigquery.py is a manual, re-runnable loader with no scheduled job of
# its own, so sg_housing.hdb_resale_prices quietly goes stale until someone remembers to re-run it
# (it did — see https://github.com/leshweyeewin/merlion-os/issues/10). The data.gov.sg dataset
# itself only gets a fresh bulk file roughly quarterly, so this runs quarterly too, just ahead of
# the daily monitor.yml check (01:30 UTC) so a fresh load is reflected the same day.

on:
  schedule:
    - cron: "0 1 1 1,4,7,10 *"   # 01:00 UTC on the 1st of Jan/Apr/Jul/Oct
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Reload hdb_resale_prices from data.gov.sg
        run: python scripts/load_hdb_resale_to_bigquery.py --project gen-lang-client-0985772581
