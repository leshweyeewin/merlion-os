name: Refresh data seeds

# The HDB newsroom and MOM OWS sources ship committed fallback seeds (data_seed/*.json) that the
# app serves when a live fetch fails. This job re-scrapes them from a GitHub-hosted runner (an IP
# the .gov.sg WAFs generally allow) and — only when the scraped DATA actually changes — commits the
# refreshed seed. The push to main is picked up by Render's auto-deploy; no explicit deploy call.
#
# On Render (the canonical deployment) the app fetches these sources LIVE — AWS egress IPs aren't
# WAF-blocked like GCP's were — so the seed is mainly a safety net; keeping it fresh just means the
# fallback is never far off if a live fetch ever fails. If the runner IP is blocked for a source,
# scripts/refresh_seeds.py skips it and leaves the good seed untouched (never clobbers good data).

on:
  schedule:
    # Hourly. The commit only fires when the scraped DATA actually changes (refresh_seeds.py
    # compares payloads and ignores timestamps), so most runs are a cheap no-op — HDB posts a few
    # times a week, MOM OWS is annual. Widen the interval any time, e.g. "0 */6 * * *".
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # commit the refreshed seeds (Render auto-deploy picks up the push)

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4 openpyxl

      - name: Refresh seeds
        run: python scripts/refresh_seeds.py

      - name: Commit refreshed seeds
        run: |
          if git diff --quiet -- data_seed/; then
            echo "No seed changes this run — nothing to commit."
            exit 0
          fi
          git config user.name "merlion-seed-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_seed/
          git commit -m "chore: refresh .gov.sg data seeds"
          git push
          echo "Seeds changed — pushed to main; Render auto-deploy will pick it up."
